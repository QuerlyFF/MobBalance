# MobBalance — базовый баланс мобов для SMP Cristalix.
# Все значения ниже применяются только на сложности HARD.

general:
  enabled: true
  difficulty: HARD
  spawn-reasons:
    - NATURAL
    - CHUNK_GEN
    - REINFORCEMENTS
    - VILLAGE_INVASION
    - PATROL
    - SPAWNER
    - TRIAL_SPAWNER

stats:
  # Общий случайный бонус для мобов, у которых включён баф HP/урона.
  health-bonus-min-percent: 0.0
  health-bonus-max-percent: 100.0
  damage-bonus-min-percent: 0.0
  damage-bonus-max-percent: 100.0

equipment:
  multiplier: 8.0
  armor-base-chance: 0.15
  armor-cap: 0.90

  zombie-weapon-base-chance: 0.05
  zombie-weapon-cap: 0.40

  drowned-weapon-chance: 0.40
  drowned-trident-share: 0.50

  generated-item-drop-chance: 0.02

  armor-tier-weights:
    leather: 20
    gold: 25
    chainmail: 25
    iron: 25
    diamond: 5

  armor-piece-count-weights:
    one: 20
    two: 30
    three: 30
    four: 20

enchantments:
  multiplier: 3.5
  armor-base-chance: 0.50
  armor-cap: 0.75
  weapon-base-chance: 0.25
  weapon-cap: 0.70

projectiles:
  skeleton:
    negative-effect-chance: 0.35

  stray:
    # Если наш дебафф не прокнул, остаётся ванильное замедление Stray.
    negative-effect-chance: 0.35

  bogged:
    # Боггед получает те же дополнительные дебаффы, что Skeleton/Stray.
    negative-effect-chance: 0.35
    # Базовый яд Bogged усиливаем: Poison II на 8 секунд гарантированно.
    base-poison-duration-ticks: 160
    base-poison-amplifier: 1

  effects:
    slowness:
      weight: 35
      duration-ticks: 120
      amplifier: 0
    weakness:
      weight: 30
      duration-ticks: 160
      amplifier: 0
    poison:
      weight: 25
      duration-ticks: 100
      amplifier: 0
    wither:
      weight: 10
      duration-ticks: 60
      amplifier: 0

spiders:
  spider:
    speed-multiplier: 1.20
    poison-duration-ticks: 100
    poison-amplifier: 0

  cave-spider:
    speed-multiplier: 1.25
    poison-duration-ticks: 300
    poison-amplifier: 1

creeper:
  aggro-speed-multiplier: 1.15
  explosion-radius-multiplier: 1.25
  fuse-time-multiplier: 0.80

# Slime использует общий случайный +0–100% HP и +0–100% урона.
slime:
  enabled: true

witch:
  # HP получает общий +0–100%. Урон отдельно не увеличиваем.
  # В 65% случаев через 8 тиков после обычного броска летит ещё одно такое же зелье.
  extra-potion-chance: 0.65
  extra-potion-delay-ticks: 8

enderman:
  # HP/урон: общий +0–100%. Дополнительно очень сильно ускоряем.
  speed-multiplier: 1.55

phantom:
  # HP остаётся ванильным. Урон: общий +0–100%.
  speed-multiplier: 1.35
