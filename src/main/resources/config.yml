# MobBalance — базовый баланс мобов для SMP Cristalix.
# Все значения ниже применяются только на сложности HARD.

general:
  enabled: true
  difficulty: HARD
  spawn-reasons:
    - NATURAL
    - CHUNK_GEN
    - REINFORCEMENTS
    - VILLAGE_INVASION
    - PATROL
    - SPAWNER
    - TRIAL_SPAWNER
    - SLIME_SPLIT

stats:
  health-bonus-min-percent: 0.0
  health-bonus-max-percent: 100.0
  damage-bonus-min-percent: 0.0
  damage-bonus-max-percent: 100.0

equipment:
  multiplier: 8.0
  armor-base-chance: 0.15
  armor-cap: 0.90
  zombie-weapon-base-chance: 0.05
  zombie-weapon-cap: 0.40
  drowned-weapon-chance: 0.40
  drowned-trident-share: 0.50
  generated-item-drop-chance: 0.02

  armor-tier-weights:
    leather: 20
    gold: 25
    chainmail: 25
    iron: 25
    diamond: 5

  armor-piece-count-weights:
    one: 20
    two: 30
    three: 30
    four: 20

enchantments:
  multiplier: 3.5
  armor-base-chance: 0.50
  armor-cap: 0.75
  weapon-base-chance: 0.25
  weapon-cap: 0.70

projectiles:
  skeleton:
    negative-effect-chance: 0.35
  stray:
    negative-effect-chance: 0.35
  bogged:
    negative-effect-chance: 0.35
    base-poison-duration-ticks: 160
    base-poison-amplifier: 1
  raiders:
    # Pillager и Piglin с арбалетом используют тот же пул дебаффов.
    negative-effect-chance: 0.35

  effects:
    slowness:
      weight: 35
      duration-ticks: 120
      amplifier: 0
    weakness:
      weight: 30
      duration-ticks: 160
      amplifier: 0
    poison:
      weight: 25
      duration-ticks: 100
      amplifier: 0
    wither:
      weight: 10
      duration-ticks: 60
      amplifier: 0

spiders:
  spider:
    speed-multiplier: 1.20
    poison-duration-ticks: 100
    poison-amplifier: 0
  cave-spider:
    speed-multiplier: 1.25
    poison-duration-ticks: 300
    poison-amplifier: 1

creeper:
  aggro-speed-multiplier: 1.15
  explosion-radius-multiplier: 1.25
  fuse-time-multiplier: 0.80

slime:
  enabled: true

witch:
  extra-potion-chance: 0.65
  extra-potion-delay-ticks: 8

enderman:
  speed-multiplier: 1.55

phantom:
  speed-multiplier: 1.35

pillager:
  # Арбалет гарантированно получает Quick Charge III.
  quick-charge-level: 3

vindicator:
  # HP получает общий +0–100%, урон не бафается.
  speed-multiplier: 1.25

evoker:
  # В среднем только половина бафнутых Evoker оставляет тотем.
  totem-drop-chance: 0.50
  # 60% обычных кастов получают дополнительную волну способности.
  repeat-ability-chance: 0.60
  repeat-delay-ticks: 20
  fang-damage-multiplier: 1.50
  extra-vex-count: 1

breeze:
  extra-shot-chance: 0.50
  extra-shot-delay-ticks: 6

blaze:
  # HP получает общий +0–100%, прямой урон не меняем.
  extra-shot-chance: 0.50
  extra-shot-delay-ticks: 6

ghast:
  # HP не меняем. Усиливаем попадание огненного шара и шанс второго выстрела.
  damage-multiplier: 1.35
  extra-shot-chance: 0.40
  extra-shot-delay-ticks: 10

# Wither Skeleton получает общий +0–100% HP/урона и усиленную броню/меч.
# Лук ему никогда не выдаётся.
wither-skeleton:
  enabled: true

# Обычный Piglin: если появился с арбалетом, получает Quick Charge III и дебафф-стрелы.
# Piglin Brute не трогаем.
piglin:
  crossbow-buff: true
